[project]
name = "supplies-agent"
version = "0.1.0"
description = "Lab Supplies Agent: Strands agent + MCP server over a mock inventory and ordering service"
readme = "README.md"
authors = [
    { name = "Ntaikos Kostantinos", email = "daikoskon@gmail.com" }
]
requires-python = ">=3.12"
# Shared by every layer. Per-layer runtime deps live in the dependency groups below,
# so each service image installs only its own group (uv sync --no-default-groups --group <layer>).
dependencies = [
    "pydantic-settings>=2.16.0",
]

[project.scripts]
mock-api = "supplies_agent.api.app:main"
mcp-server = "supplies_agent.mcp_server.server:main"
agent-service = "supplies_agent.agent.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
agent = [
    "fastapi>=0.143.1",
    "strands-agents[anthropic]>=1.61.0",
    "uvicorn[standard]>=0.54.0",
]
api = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
mcp = [
    "httpx2>=2.13.1",
    "mcp>=2.1,<2.2",
]

[tool.uv]
# Install every group locally, so uv sync / uv run work unchanged.
default-groups = "all"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
