<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab supplies agent</title>
<script>
// Theme: "system" (default), "light" or "dark". Applied before first paint to avoid a flash.
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function themePreference() {
  try { return localStorage.getItem("theme") || "system"; } catch { return "system"; }
}
function applyTheme() {
  const pref = themePreference();
  const dark = pref === "dark" || (pref === "system" && darkQuery.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.querySelectorAll(".theme-menu button").forEach((b) => {
    const current = b.dataset.theme === pref;
    b.setAttribute("aria-checked", String(current));
    if (current) document.getElementById("theme-toggle").innerHTML = b.querySelector(".icon").innerHTML;
  });
}
darkQuery.addEventListener("change", applyTheme);
applyTheme();
</script>
<style>
  :root {
    --bg: #f4f5f8; --surface: #fff; --surface-2: #f8f9fb; --border: #e3e6ec;
    --text: #1b1f24; --muted: #6b7380; --accent: #4f46e5; --accent-text: #fff;
    --ok: #15803d; --ok-text: #fff; --ok-bg: #e7f6ec; --err: #b42318; --err-bg: #fdecea;
    --warn: #b45309; --warn-bg: #fff7e6; --shadow: 0 1px 2px rgb(16 24 40 / .06), 0 1px 3px rgb(16 24 40 / .08);
    color-scheme: light;
  }
  /* data-theme is always set by the script in <head>: the user's choice, or the system's. */
  :root[data-theme="dark"] {
    --bg: #0f1115; --surface: #181b21; --surface-2: #1f232b; --border: #2b3039;
    --text: #e6e8eb; --muted: #9aa3ae; --accent: #818cf8; --accent-text: #0f1115;
    --ok: #4ade80; --ok-text: #0f1115; --ok-bg: #12301f; --err: #f87171; --err-bg: #3a1615;
    --warn: #fbbf24; --warn-bg: #33260b; --shadow: none;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0;
         background: var(--bg); color: var(--text);
         height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  button, input, textarea { font: inherit; color: inherit; }
  .column { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  header .column { max-width: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-block: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 600; }
  .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
          background: var(--accent); color: var(--accent-text); font-size: 16px; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .field { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; border-radius: 999px;
           background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; color: var(--muted); }
  .field input { border: 0; background: transparent; width: 7em; outline: none; font-size: 13px; }
  .field code { font-size: 12px; color: var(--text); padding-right: 6px; }
  .ghost { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
           padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .ghost:hover { background: var(--surface-2); }
  .theme { position: relative; }
  #theme-toggle { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; color: var(--muted); }
  #theme-toggle:hover { color: var(--text); }
  .theme-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 140px; padding: 4px;
                background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
                box-shadow: 0 8px 24px rgb(16 24 40 / .14); }
  .theme-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0;
                       border-radius: 6px; background: transparent; cursor: pointer; font-size: 13px; text-align: left; }
  .theme-menu button:hover { background: var(--surface-2); }
  .theme-menu .icon { display: grid; color: var(--muted); }
  .theme-menu button::after { content: "✓"; margin-left: auto; color: var(--accent); visibility: hidden; }
  .theme-menu button[aria-checked="true"]::after { visibility: visible; }

  /* Conversation */
  main { flex: 1; overflow-y: auto; }
  #log { display: flex; flex-direction: column; gap: 14px; padding-block: 20px; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row.user { justify-content: flex-end; }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
            background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
  .bubble { max-width: min(640px, 85%); padding: 10px 14px; border-radius: 16px; box-shadow: var(--shadow);
            overflow-wrap: anywhere; }
  .agent .bubble { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .user .bubble { background: var(--accent); color: var(--accent-text); border-top-right-radius: 4px;
                  white-space: pre-wrap; }
  .notice { align-self: center; max-width: 90%; font-size: 13px; padding: 6px 12px; border-radius: 999px;
            background: var(--err-bg); color: var(--err); }
  .meta { margin-top: 8px; font-size: 11px; color: var(--muted); }

  /* Reply text (a small, safe subset of Markdown) */
  .md > * { margin: 0 0 8px; } .md > :last-child { margin-bottom: 0; }
  .md ul, .md ol { padding-left: 20px; }
  .md code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2);
             border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
  .md .h { font-weight: 600; }
  .md .table { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border-bottom: 1px solid var(--border); padding: 4px 12px 4px 0; text-align: left; }

  /* Tool calls */
  .tools { margin-bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
  .tools-title { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  details.tool { border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
  details.tool summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
                         padding: 5px 10px; font-size: 12px; }
  details.tool summary::-webkit-details-marker { display: none; }
  details.tool summary::after { content: "›"; margin-left: auto; color: var(--muted); transition: transform .15s; }
  details.tool[open] summary::after { transform: rotate(90deg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--warn); }
  .dot.success { background: var(--ok); } .dot.error { background: var(--err); }
  .tool-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
  .tool-args { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--border); font-size: 12px;
              white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; }
  .tool pre b { color: var(--muted); font-weight: 600; }

  /* Typing indicator */
  .typing { display: flex; align-items: center; gap: 10px; }
  .dots { display: inline-flex; gap: 4px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
               animation: bounce 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
  .typing small { color: var(--muted); }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); }
                      40% { opacity: 1; transform: translateY(-4px); } }

  /* Approval card */
  .approval { border: 1px solid var(--warn) !important; }
  .approval-head { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
  .pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
          background: var(--warn-bg); color: var(--warn); }
  .approval table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .approval th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; }
  .approval th, .approval td { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .approval td.qty, .approval th.qty { text-align: right; }
  .deliver { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-weight: 600;
                    border: 1px solid transparent; }
  .actions .approve { background: var(--ok); color: var(--ok-text); }
  .actions .decline { background: transparent; border-color: var(--err); color: var(--err); }
  .actions button.chosen { box-shadow: 0 0 0 3px var(--warn-bg), 0 0 0 4px var(--warn); }
  .actions button:disabled { opacity: .5; cursor: default; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 0 8px; color: var(--muted); }
  .empty h2 { color: var(--text); font-size: 20px; margin: 0 0 4px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .chips button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
                  padding: 7px 14px; cursor: pointer; box-shadow: var(--shadow); }
  .chips button:hover { border-color: var(--accent); }

  /* Composer */
  footer { padding-block: 10px 14px; }
  form { display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 14px;
         background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
  form:focus-within { border-color: var(--accent); }
  textarea { flex: 1; border: 0; outline: none; background: transparent; resize: none;
             padding: 7px 0; max-height: 160px; line-height: 1.45; overflow-y: hidden; }
  #send { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
          background: var(--accent); color: var(--accent-text); display: grid; place-items: center; }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  .hint.waiting { color: var(--warn); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="column">
    <div class="brand">
      <div class="logo">⚗</div>
      <div>Lab supplies agent<small>Stock, catalogue and purchase orders</small></div>
    </div>
    <label class="field">User <input id="user" autocomplete="off" spellcheck="false"></label>
    <span class="field">Session <code id="session"></code></span>
    <button id="new-session" class="ghost" type="button">＋ New session</button>
    <div class="theme">
      <button id="theme-toggle" class="ghost" type="button" title="Theme" aria-label="Theme"
              aria-haspopup="menu" aria-expanded="false"></button>
      <div id="theme-menu" class="theme-menu" role="menu" hidden>
        <button type="button" role="menuitemradio" data-theme="light"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>Light</button>
        <button type="button" role="menuitemradio" data-theme="dark"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>Dark</button>
        <button type="button" role="menuitemradio" data-theme="system"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span>System</button>
      </div>
    </div>
  </div>
</header>
<main id="scroll">
  <div class="column"><div id="log"></div></div>
</main>
<footer>
  <div class="column">
    <form id="composer">
      <textarea id="message" rows="1" placeholder="Ask about reagents or consumables…"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <div id="hint" class="hint"></div>
  </div>
</footer>
<script>
// A thin client of POST /invocations. The server holds the real session and pending
// orders; the transcript is kept in localStorage only so a page reload can redraw it.
const SESSION_HEADER = "X-Amzn-Bedrock-AgentCore-Runtime-Session-Id";
const USER_HEADER = "X-User-Id";
const ID_PATTERN = /^[A-Za-z0-9_.-]{1,100}$/;
const SUGGESTIONS = [
  "Do we have PBS in stock?",
  "Find nitrile gloves, size M",
  "Order 2 bottles of PBS",
];

const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

let userId = store.get("userId", "alice");
let sessionId = store.get("sessionId", null) || crypto.randomUUID();
let state = { entries: [], pending: [] };  // transcript of this (user, session)
let decisions = {};                         // interrupt_id -> "approve" | "decline"
let busy = false;
let busySince = 0;

const transcriptKey = () => `transcript:${userId}:${sessionId}`;

function load() {
  store.set("userId", userId);
  store.set("sessionId", sessionId);
  $("user").value = userId;
  $("session").textContent = sessionId.slice(0, 8);
  $("session").title = sessionId;
  state = store.get(transcriptKey(), { entries: [], pending: [] });
  decisions = {};
  render();
}

function save() { store.set(transcriptKey(), state); }

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) node[k] = v; else node.setAttribute(k, v);
  }
  // Model output and tool results are always added as text, never as HTML.
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// A small, safe subset of Markdown: paragraphs, headings, lists, tables, **bold**, `code`.
function inline(text) {
  return text.split(/(\*\*[^*]+\*\*|`[^`]+`)/).filter(Boolean).map((part) =>
    part.startsWith("**") && part.endsWith("**") && part.length > 4 ? el("strong", {}, part.slice(2, -2))
    : part.startsWith("`") && part.endsWith("`") && part.length > 2 ? el("code", {}, part.slice(1, -1))
    : document.createTextNode(part));
}

function markdown(text) {
  const root = el("div", { class: "md" });
  const lines = (text || "").split("\n");
  const cells = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const isList = (line) => /^\s*([-*]|\d+\.)\s+/.test(line);
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if (line.trim().startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) {
        if (!/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i])) rows.push(cells(lines[i]));
        i++;
      }
      const [head, ...body] = rows;
      root.append(el("div", { class: "table" }, el("table", {},
        el("tr", {}, ...head.map((c) => el("th", {}, ...inline(c)))),
        ...body.map((r) => el("tr", {}, ...r.map((c) => el("td", {}, ...inline(c))))))));
    } else if (/^#{1,6}\s/.test(line)) {
      root.append(el("div", { class: "h" }, ...inline(line.replace(/^#+\s/, ""))));
      i++;
    } else if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const list = el(ordered ? "ol" : "ul");
      while (i < lines.length && isList(lines[i])) {
        list.append(el("li", {}, ...inline(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""))));
        i++;
      }
      root.append(list);
    } else {
      const para = el("p");
      while (i < lines.length && lines[i].trim() && !isList(lines[i]) &&
             !lines[i].trim().startsWith("|") && !/^#{1,6}\s/.test(lines[i])) {
        if (para.childNodes.length) para.append(el("br"));
        para.append(...inline(lines[i]));
        i++;
      }
      root.append(para);
    }
  }
  return root;
}

function toolCallView(call) {
  const status = call.status || "waiting";
  const args = Object.entries(call.input || {})
    .map(([k, v]) => `${k}: ${typeof v === "string" ? v : JSON.stringify(v)}`).join(", ");
  const pre = el("pre", {}, el("b", {}, "input "), JSON.stringify(call.input, null, 2));
  if (call.result != null) pre.append("\n\n", el("b", {}, "result "), call.result);
  return el("details", { class: "tool" },
    el("summary", { title: status },
      el("span", { class: `dot ${status}` }),
      el("span", { class: "tool-name" }, call.name),
      el("span", { class: "tool-args" }, args)),
    pre);
}

function agentRow(...content) {
  return el("div", { class: "row agent" }, el("div", { class: "avatar" }, "⚗"), ...content);
}

function entryView(entry) {
  if (entry.role === "user") return el("div", { class: "row user" }, el("div", { class: "bubble" }, entry.text));
  if (entry.role === "error") return el("div", { class: "notice" }, entry.text);
  const bubble = el("div", { class: "bubble" });
  if (entry.tool_calls.length) {
    bubble.append(el("div", { class: "tools" },
      el("div", { class: "tools-title" }, `${entry.tool_calls.length} tool call${entry.tool_calls.length > 1 ? "s" : ""}`),
      ...entry.tool_calls.map(toolCallView)));
  }
  bubble.append(markdown(entry.reply));
  bubble.append(el("div", { class: "meta" },
    `${(entry.latency_ms / 1000).toFixed(1)} s · ${entry.usage.input_tokens.toLocaleString()} in / ` +
    `${entry.usage.output_tokens.toLocaleString()} out tokens · ${entry.stop_reason}`));
  return agentRow(bubble);
}

function approvalView(p) {
  const chosen = decisions[p.interrupt_id];
  const button = (decision, label) => el("button", {
    type: "button",
    class: decision + (chosen === decision ? " chosen" : ""),
    onclick: () => decide(p.interrupt_id, decision),
  }, label);
  const actions = el("div", { class: "actions" }, button("approve", "✓ Approve"), button("decline", "✕ Decline"));
  actions.querySelectorAll("button").forEach((b) => (b.disabled = busy));
  return agentRow(el("div", { class: "bubble approval" },
    el("div", { class: "approval-head" }, "Purchase order", el("span", { class: "pill" }, "Needs approval")),
    el("table", {},
      el("tr", {}, el("th", {}, "SKU"), el("th", { class: "qty" }, "Qty")),
      ...p.lines.map((l) => el("tr", {}, el("td", {}, el("code", {}, l.sku)), el("td", { class: "qty" }, String(l.quantity))))),
    el("div", { class: "deliver" }, `Deliver to: ${p.deliver_to || "not specified"}`),
    actions));
}

function typingView() {
  const slow = Date.now() - busySince > 8000;
  return agentRow(el("div", { class: "bubble typing" },
    el("span", { class: "dots" }, el("span"), el("span"), el("span")),
    slow ? el("small", {}, "Still working — the supplier system may be slow, retrying…") : null));
}

function emptyView() {
  return el("div", { class: "empty" },
    el("h2", {}, "What do you need for the lab?"),
    el("div", {}, "I check stock first, search approved suppliers, and only order after you approve."),
    el("div", { class: "chips" }, ...SUGGESTIONS.map((s) => el("button", { type: "button", onclick: () => send(s) }, s))));
}

function render() {
  const nodes = [...state.entries.map(entryView), ...state.pending.map(approvalView)];
  if (busy) nodes.push(typingView());
  if (!nodes.length) nodes.push(emptyView());
  $("log").replaceChildren(...nodes);

  const waiting = state.pending.length > 0;
  $("message").disabled = busy || waiting;
  $("send").disabled = busy || waiting;
  $("hint").className = "hint" + (waiting && !busy ? " waiting" : "");
  $("hint").textContent = waiting && !busy ? "Approve or decline the purchase order to continue"
    : "Enter to send · Shift+Enter for a new line";
  $("scroll").scrollTop = $("scroll").scrollHeight;
  if (!busy && !waiting) $("message").focus();
}

async function invoke(body) {
  busy = true;
  busySince = Date.now();
  render();
  const slowTimer = setTimeout(render, 8100);  // swap in the "still working" note
  try {
    const response = await fetch("/invocations", {
      method: "POST",
      headers: { "Content-Type": "application/json", [USER_HEADER]: userId, [SESSION_HEADER]: sessionId },
      body: JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({}));
    if (response.ok) {
      state.entries.push({ role: "agent", ...data, latency_ms: Date.now() - busySince });
      state.pending = data.pending_approvals;
    } else {
      const detail = data.detail;
      // A 409 carries the server's pending list: trust it over what the page remembered.
      if (detail && Array.isArray(detail.pending_approvals)) state.pending = detail.pending_approvals;
      const message = typeof detail === "string" ? detail : detail?.message || JSON.stringify(detail);
      state.entries.push({ role: "error", text: `${response.status} · ${message || response.statusText}` });
    }
  } catch (e) {
    state.entries.push({ role: "error", text: `Request failed: ${e.message}` });
  } finally {
    clearTimeout(slowTimer);
    busy = false;
    decisions = {};
    save();
    render();
  }
}

function send(text) {
  if (!text || busy || state.pending.length) return;
  state.entries.push({ role: "user", text });
  invoke({ message: text });
}

function decide(interruptId, decision) {
  if (busy) return;
  decisions[interruptId] = decision;
  // The server takes one decision per pending order in a single request.
  if (state.pending.every((p) => decisions[p.interrupt_id])) {
    const approvals = state.pending.map((p) => ({ interrupt_id: p.interrupt_id, decision: decisions[p.interrupt_id] }));
    const summary = approvals.map((a) => (a.decision === "approve" ? "Approved" : "Declined")).join(", ");
    state.entries.push({ role: "user", text: `${summary} the purchase order.` });
    invoke({ approvals });
  } else {
    render();
  }
}

function resizeComposer() {
  const box = $("message");
  box.style.height = "auto";
  box.style.height = `${box.scrollHeight}px`;
  box.style.overflowY = box.scrollHeight > 160 ? "auto" : "hidden";
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("message").value.trim();
  if (!text) return;
  $("message").value = "";
  resizeComposer();
  send(text);
});

$("message").addEventListener("input", resizeComposer);
$("message").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("user").addEventListener("change", () => {
  const value = $("user").value.trim();
  if (!ID_PATTERN.test(value)) { $("user").value = userId; return; }
  // Same session id, different user: the server answers 403, which shows isolation.
  userId = value;
  load();
});

$("new-session").addEventListener("click", () => {
  if (busy) return;
  sessionId = crypto.randomUUID();
  load();
});

function setThemeMenu(open) {
  $("theme-menu").hidden = !open;
  $("theme-toggle").setAttribute("aria-expanded", String(open));
}
$("theme-toggle").addEventListener("click", (event) => {
  event.stopPropagation();
  setThemeMenu($("theme-menu").hidden);
});
document.querySelectorAll(".theme-menu button").forEach((button) => button.addEventListener("click", () => {
  try { localStorage.setItem("theme", button.dataset.theme); } catch {}
  applyTheme();
  setThemeMenu(false);
}));
document.addEventListener("click", (event) => {
  if (!event.target.closest(".theme")) setThemeMenu(false);
});
document.addEventListener("keydown", (event) => { if (event.key === "Escape") setThemeMenu(false); });

applyTheme();
load();
</script>
</body>
</html>
